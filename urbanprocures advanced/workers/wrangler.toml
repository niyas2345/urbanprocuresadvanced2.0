# ISOLATED ADVANCED ONLY. No production routes, resources, or credentials.
# Placeholder bindings intentionally prevent remote deployment until separately provisioned.
name = "urbanprocures-advanced-worker"
main = "index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
ENVIRONMENT = "advanced-development"
PLATFORM_DOMAIN = "localhost"
SERVICE_CHARGE_DEFAULT_PERCENT = "0.025"
SERVICE_CHARGE_MINIMUM_AED = "500"
SITE_VISIT_FEE_AED = "100"

[[d1_databases]]
binding = "DB"
database_name = "urbanprocures-advanced-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../database/migrations"

[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "urbanprocures-advanced-documents"

# KV and Queues are omitted: no implemented Worker route currently requires them.
# Run: node scripts/check-isolation.mjs before any future infrastructure action.
# Canonical migrations are for EMPTY new Advanced resources only. Existing snapshots need preflight/upgrade.

[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
