# New Advanced production resources only. No live domains until preview acceptance.
name = "urbanprocures-advanced-production-20261007"
account_id = "dcb411ece67dfdfb730635133ed31825"
main = "index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "urbanprocures.com/*"
zone_id = "01e244afa455228e04c47e78174d76f1"

[[routes]]
pattern = "www.urbanprocures.com/*"
zone_id = "01e244afa455228e04c47e78174d76f1"

[vars]
ENVIRONMENT = "advanced-production"
PLATFORM_DOMAIN = "urbanprocures.com"
PUBLIC_APP_ORIGIN = "https://urbanprocures.com"
ZOHO_MAIL_ACCOUNT_ID = "6991914000000008002"
ZOHO_MAIL_FROM_ADDRESS = "urbanprocures@urbanprocures.com"
ZOHO_MAIL_API_ORIGIN = "https://mail.zoho.com"
ZOHO_ACCOUNTS_API_ORIGIN = "https://accounts.zoho.com"
EMAIL_DELIVERY_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "urbanprocures-advanced-production-20261007-db"
database_id = "3412487b-954b-4f21-92d3-20d85d30dc11"
migrations_dir = "../database/migrations"

[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "urbanprocures-advanced-production-20261007-documents"

[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1.0
